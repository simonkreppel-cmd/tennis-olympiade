<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Saisonabschluss-Olympiade Scoreboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f7ef;
    --surface: #ffffff;
    --surface-2: #eaf0e1;
    --text: #1b2417;
    --text-muted: #5c6b54;
    --border: #d9e1cf;
    --accent: #6ba50f;
    --accent-ink: #22320a;
    --accent-soft: #e3f0d2;
    --clay: #b8552e;
    --clay-soft: #f3ded3;
    --gold: #ad8a1f;
    --silver: #7c8790;
    --bronze: #a05a26;
    --shadow: rgba(27, 36, 23, 0.10);
    --danger: #b8552e;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10150c;
      --surface: #171f13;
      --surface-2: #202b19;
      --text: #eaf1e1;
      --text-muted: #9db28d;
      --border: #2a3722;
      --accent: #a8e13c;
      --accent-ink: #16210a;
      --accent-soft: #263a15;
      --clay: #e0794c;
      --clay-soft: #3a2418;
      --gold: #e0c04a;
      --silver: #b7c2ca;
      --bronze: #d98a4a;
      --shadow: rgba(0, 0, 0, 0.45);
      --danger: #e0794c;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10150c;
    --surface: #171f13;
    --surface-2: #202b19;
    --text: #eaf1e1;
    --text-muted: #9db28d;
    --border: #2a3722;
    --accent: #a8e13c;
    --accent-ink: #16210a;
    --accent-soft: #263a15;
    --clay: #e0794c;
    --clay-soft: #3a2418;
    --gold: #e0c04a;
    --silver: #b7c2ca;
    --bronze: #d98a4a;
    --shadow: rgba(0, 0, 0, 0.45);
    --danger: #e0794c;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Manrope", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
    padding-bottom: 3rem;
  }
  h1, h2, h3 { font-family: "Anton", "Manrope", sans-serif; font-weight: 400; letter-spacing: 0.01em; text-wrap: balance; margin: 0; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  a { color: var(--accent-ink); }
  :root[data-theme="dark"] a, :root:not([data-theme="light"]) a { color: var(--accent); }
  button { font-family: inherit; }
  input[type="text"], input[type="number"], input[type="search"], textarea {
    font-family: inherit;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 0.6rem;
    padding: 0.6rem 0.7rem;
    color: var(--text);
    font-size: 1rem;
    width: 100%;
  }
  textarea { resize: vertical; font-size: 0.92rem; line-height: 1.4; }
  input:focus-visible, button:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  header.top {
    background: var(--accent-ink);
    color: var(--accent-soft);
    padding: 1.4rem 1.1rem 1.1rem;
    position: relative;
    overflow: hidden;
  }
  header.top::after {
    content: "";
    position: absolute;
    right: -40px; top: -40px;
    width: 160px; height: 160px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, var(--accent) 0%, transparent 70%);
    opacity: 0.35;
  }
  .top-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.9rem; position: relative; z-index: 1; }
  .club-logo { flex: none; height: 56px; width: auto; margin-top: 0.15rem; }
  header.top h1 { font-size: 1.9rem; color: #fff; }
  header.top .sub { font-size: 0.92rem; color: rgba(255,255,255,0.78); margin-top: 0.25rem; }
  header.top .event-meta { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.6rem; position: relative; z-index: 1; }
  .pill {
    display: inline-flex; align-items: center; gap: 0.3rem;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.18);
    color: rgba(255,255,255,0.92);
    padding: 0.25rem 0.65rem;
    border-radius: 999px;
    font-size: 0.78rem;
  }

  nav.tabbar {
    position: sticky; top: 0; z-index: 10;
    display: flex;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 2px 10px var(--shadow);
  }
  nav.tabbar button {
    flex: 1;
    padding: 0.85rem 0.4rem;
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-weight: 600;
    font-size: 0.88rem;
    border-bottom: 3px solid transparent;
    cursor: pointer;
  }
  nav.tabbar button.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }

  main { max-width: 720px; margin: 0 auto; padding: 1.1rem; }
  .view { display: none; }
  .view.active { display: block; }

  .banner {
    background: var(--clay-soft);
    color: var(--clay);
    border: 1px solid var(--clay);
    border-radius: 0.7rem;
    padding: 0.7rem 0.9rem;
    font-size: 0.88rem;
    margin-bottom: 1rem;
    display: none;
  }
  .banner.show { display: block; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 0.9rem;
    padding: 1rem;
    margin-bottom: 0.9rem;
    box-shadow: 0 1px 3px var(--shadow);
  }
  .card h2 { font-size: 1.05rem; margin-bottom: 0.7rem; }
  .card h3 { font-size: 0.98rem; }
  .muted { color: var(--text-muted); font-size: 0.85rem; }
  .center { text-align: center; }

  .lb-row {
    display: flex; align-items: center; gap: 0.8rem;
    padding: 0.7rem 0.2rem;
    border-bottom: 1px solid var(--border);
  }
  .lb-row:last-child { border-bottom: none; }
  .rank-badge {
    flex: none;
    width: 2.3rem; height: 2.3rem;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: "Anton", sans-serif;
    font-size: 1.05rem;
    background: var(--surface-2);
    color: var(--text-muted);
    border: 2px solid var(--border);
  }
  .rank-badge.r1 { background: var(--gold); color: var(--accent-ink); border-color: var(--gold); }
  .rank-badge.r2 { background: var(--silver); color: var(--accent-ink); border-color: var(--silver); }
  .rank-badge.r3 { background: var(--bronze); color: #fff; border-color: var(--bronze); }
  .lb-name { flex: 1; font-weight: 700; font-size: 1.02rem; }
  .lb-total { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
  .lb-total .unit { font-size: 0.7rem; color: var(--text-muted); font-weight: 500; margin-left: 0.2rem; }

  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 0.7rem; }
  table.matrix { border-collapse: collapse; width: 100%; font-size: 0.82rem; }
  table.matrix th, table.matrix td {
    padding: 0.5rem 0.6rem;
    text-align: center;
    white-space: nowrap;
    border-bottom: 1px solid var(--border);
  }
  table.matrix th { background: var(--surface-2); font-weight: 700; text-align: left; }
  table.matrix td:first-child, table.matrix th:first-child { text-align: left; font-weight: 600; position: sticky; left: 0; background: var(--surface); }
  table.matrix th:first-child { background: var(--surface-2); }
  table.matrix td.total-col, table.matrix th.total-col { font-weight: 800; font-family: "JetBrains Mono", monospace; }

  .explain-title {
    font-weight: 700; font-size: 0.9rem; color: var(--accent-ink);
  }
  :root[data-theme="dark"] .explain-title,
  :root:not([data-theme="light"]) .explain-title { color: var(--accent); }
  .explain p { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; margin: 0.6rem 0 0; }

  .player-row, .game-setup-row {
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0.5rem 0; border-bottom: 1px solid var(--border);
  }
  .player-row:last-of-type, .game-setup-row:last-of-type { border-bottom: none; }

  .icon-btn {
    flex: none; width: 2.2rem; height: 2.2rem;
    border-radius: 0.5rem; border: 1px solid var(--border);
    background: var(--surface); color: var(--danger);
    cursor: pointer; font-size: 1rem; line-height: 1;
  }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
    border-radius: 0.65rem;
    padding: 0.65rem 1rem;
    font-weight: 700;
    font-size: 0.92rem;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
  }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn-block { width: 100%; }
  .btn:disabled { opacity: 0.6; cursor: default; }
  .btn-pick { justify-content: flex-start; text-align: left; }

  .game-setup-card { border: 1px solid var(--border); border-radius: 0.75rem; padding: 0.8rem; margin-bottom: 0.7rem; background: var(--surface-2); }
  .field-grid { display: grid; grid-template-columns: 1fr; gap: 0.5rem; margin-top: 0.5rem; }
  .field-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); margin-bottom: 0.2rem; display: block; }
  .direction-toggle { display: flex; gap: 0.4rem; }
  .direction-toggle button {
    flex: 1; padding: 0.5rem; border-radius: 0.5rem; border: 1px solid var(--border);
    background: var(--surface); color: var(--text-muted); font-size: 0.78rem; font-weight: 700; cursor: pointer;
  }
  .direction-toggle button.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
  :root[data-theme="dark"] .direction-toggle button.active,
  :root:not([data-theme="light"]) .direction-toggle button.active { color: var(--accent); }
  .row-top { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }

  .game-item { border: 1px solid var(--border); border-radius: 0.8rem; margin-bottom: 0.7rem; overflow: hidden; background: var(--surface); }
  .game-item-head {
    display: flex; align-items: center; justify-content: space-between; gap: 0.6rem;
    padding: 0.85rem 1rem; cursor: pointer; background: var(--surface);
  }
  .game-item-head h3 { font-size: 0.98rem; }
  .game-item-head .status { font-size: 0.76rem; color: var(--text-muted); margin-top: 0.15rem; }
  .status.complete { color: var(--accent-ink); font-weight: 700; }
  :root[data-theme="dark"] .status.complete,
  :root:not([data-theme="light"]) .status.complete { color: var(--accent); }
  .chev { transition: transform 0.15s ease; color: var(--text-muted); flex: none; }
  .game-item.open .chev { transform: rotate(90deg); }
  .game-item-body { display: none; padding: 0 1rem 1rem; border-top: 1px solid var(--border); }
  .game-item.open .game-item-body { display: block; }

  .entry-row { display: flex; align-items: center; gap: 0.6rem; padding: 0.55rem 0; border-bottom: 1px dashed var(--border); }
  .entry-row:last-of-type { border-bottom: none; }
  .entry-row .name { flex: 1; font-weight: 600; font-size: 0.92rem; }
  .entry-row input[type="number"] { width: 6.5rem; text-align: right; flex: none; }
  .entry-row .unit { width: 3.2rem; font-size: 0.76rem; color: var(--text-muted); }

  .whoami { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; }
  .whoami .stat { text-align: right; }

  footer.note { text-align: center; color: var(--text-muted); font-size: 0.78rem; padding: 1.4rem 1rem 0.4rem; }
  .add-row { margin-top: 0.6rem; }
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <div>
      <h1 id="event-title-display">Saisonabschluss-Olympiade</h1>
      <div class="sub" id="event-sub-display">Live-Scoreboard</div>
      <div class="event-meta">
        <span class="pill" id="event-date-pill">📅 Datum offen</span>
        <span class="pill" id="event-players-pill">Spieler</span>
        <span class="pill" id="event-games-pill">Spiele</span>
      </div>
    </div>
    <img class="club-logo" src="/logo.png" alt="RTC Tennisclub Logo">
  </div>
</header>

<div id="app-root"><main><p class="muted center" style="padding-top:2rem;">Lade …</p></main></div>

<script>
(function () {
  "use strict";

  var API_BASE = "";
  var POLL_MS = 7000;

  function lsGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function lsSet(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }
  function lsDel(key) { try { localStorage.removeItem(key); } catch (e) {} }

  function uid(prefix) {
    return prefix + "_" + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
  }

  async function api(path, opts) {
    opts = opts || {};
    var res = await fetch(API_BASE + path, {
      method: opts.method || "GET",
      headers: opts.body ? { "Content-Type": "application/json" } : undefined,
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
    var data = null;
    try { data = await res.json(); } catch (e) {}
    if (!res.ok) {
      var err = new Error((data && data.message) || (data && data.error) || ("HTTP " + res.status));
      err.code = data && data.error;
      err.status = res.status;
      throw err;
    }
    return data;
  }

  // state.players / state.games mirror the API shape 1:1 (games carry their own .entries map).
  var state = { eventTitle: "Saisonabschluss-Olympiade", eventSub: "Live-Scoreboard", eventDate: "", players: [], games: [] };

  var role = null; // null = gate, 'admin', 'player'
  var currentPlayerId = null;
  var adminCode = lsGet("to_admin_code") || "";
  if (adminCode) role = "admin";
  else {
    var savedPid = lsGet("to_player_id");
    if (savedPid) { role = "player"; currentPlayerId = savedPid; }
  }

  var ui = {
    tab: sessionStorage.getItem("to_activeTab") || "rangliste",
    openGameId: sessionStorage.getItem("to_openGame") || null,
    filterText: "",
    lbFilterText: "",
    gateMode: "picker",
    gateFilter: "",
    gateError: "",
    gateFirst: "",
    gateLast: "",
    adminCodeInput: "",
    bulkAddText: "",
    saving: false,
    loaded: false,
    loadError: "",
  };

  // ---------- scoring (unchanged) ----------
  function computeGamePoints(game, players) {
    var entries = [];
    players.forEach(function (p) {
      var v = game.entries ? game.entries[p.id] : undefined;
      if (v !== undefined && v !== null && v !== "") entries.push({ playerId: p.id, value: Number(v) });
    });
    var n = entries.length;
    var points = {};
    if (n === 0) return points;
    entries.sort(function (a, b) {
      return game.direction === "low" ? a.value - b.value : b.value - a.value;
    });
    var i = 0;
    while (i < entries.length) {
      var j = i;
      while (j + 1 < entries.length && entries[j + 1].value === entries[i].value) j++;
      var pts = [];
      for (var k = i; k <= j; k++) pts.push(n + 1 - (k + 1));
      var avg = pts.reduce(function (a, b) { return a + b; }, 0) / pts.length;
      for (var k2 = i; k2 <= j; k2++) points[entries[k2].playerId] = avg;
      i = j + 1;
    }
    return points;
  }

  function computeTotals() {
    var totals = {};
    state.players.forEach(function (p) { totals[p.id] = 0; });
    state.games.forEach(function (g) {
      var pts = computeGamePoints(g, state.players);
      Object.keys(pts).forEach(function (pid) { totals[pid] = (totals[pid] || 0) + pts[pid]; });
    });
    return totals;
  }

  function rankedPlayers() {
    var totals = computeTotals();
    var arr = state.players.map(function (p) { return { id: p.id, name: p.name, total: totals[p.id] || 0 }; });
    arr.sort(function (a, b) { return b.total - a.total; });
    var rank = 0, prevTotal = null, seen = 0;
    arr.forEach(function (p) {
      seen++;
      if (p.total !== prevTotal) { rank = seen; prevTotal = p.total; }
      p.rank = rank;
    });
    return arr;
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function fmtPts(n) {
    return (Math.round(n * 10) / 10).toString().replace(".", ",");
  }

  // ---------- focus-preserving render ----------
  function withFocusPreserved(fn) {
    var active = document.activeElement;
    var activeId = active && active.id;
    var selStart = null, selEnd = null;
    if (active && "selectionStart" in active) {
      try { selStart = active.selectionStart; selEnd = active.selectionEnd; } catch (e) {}
    }
    fn();
    if (activeId) {
      var el = document.getElementById(activeId);
      if (el) {
        el.focus();
        if (selStart != null && "setSelectionRange" in el) {
          try { el.setSelectionRange(selStart, selEnd); } catch (e) {}
        }
      }
    }
  }

  function stashUi() {
    try {
      sessionStorage.setItem("to_activeTab", ui.tab);
      sessionStorage.setItem("to_openGame", ui.openGameId || "");
    } catch (e) {}
  }

  function applyServerState(fresh) {
    state.eventTitle = fresh.eventTitle;
    state.eventSub = fresh.eventSub;
    state.eventDate = fresh.eventDate;
    state.players = fresh.players;
    state.games = fresh.games;
  }

  async function loadState() {
    var fresh = await api("/api/state");
    applyServerState(fresh);
  }

  // ---------- background refresh so other people's entries show up ----------
  var pollTimer = null;
  function startPolling() {
    if (pollTimer) return;
    pollTimer = setInterval(function () {
      if (ui.saving) return;
      // Don't clobber in-progress admin edits: a full background refresh rebuilds
      // the whole tab from the server state, which would silently discard anything
      // typed into Setup (new names, edited fields) or an open Eingabe game panel
      // before it was saved.
      if (role === "admin" && (ui.tab === "setup" || (ui.tab === "eingabe" && ui.openGameId))) return;
      loadState().then(function () { withFocusPreserved(render); }).catch(function () {});
    }, POLL_MS);
  }

  // ---------- gate actions ----------
  window.setGateMode = function (mode) {
    ui.gateMode = mode;
    ui.gateError = "";
    render();
  };
  window.onGateFilter = function (val) {
    ui.gateFilter = val;
    withFocusPreserved(render);
  };
  window.onAdminCodeInput = function (val) {
    ui.adminCodeInput = val;
  };
  window.submitAdminCode = function () {
    if (ui.saving) return;
    var code = (ui.adminCodeInput || "").trim();
    if (!code) { ui.gateError = "Bitte Code eingeben."; render(); return; }
    ui.saving = true;
    ui.gateError = "";
    render();
    api("/api/admin", { method: "POST", body: { action: "login", code: code } })
      .then(function () {
        adminCode = code;
        lsSet("to_admin_code", code);
        role = "admin";
        ui.saving = false;
        render();
      })
      .catch(function (err) {
        ui.saving = false;
        ui.gateError = err.code === "wrong_code" ? "Code ist leider falsch." : ("Anmeldung fehlgeschlagen: " + err.message);
        render();
      });
  };
  window.selectPlayer = function (id) {
    role = "player";
    currentPlayerId = id;
    lsSet("to_player_id", id);
    render();
  };
  window.onGateFirst = function (val) { ui.gateFirst = val; };
  window.onGateLast = function (val) { ui.gateLast = val; };
  window.registerPlayer = function () {
    if (ui.saving) return;
    var first = (ui.gateFirst || "").trim();
    var last = (ui.gateLast || "").trim();
    if (!first || !last) {
      ui.gateError = "Bitte Vor- und Nachnamen eingeben.";
      render();
      return;
    }
    ui.saving = true;
    ui.gateError = "";
    render();
    api("/api/register", { method: "POST", body: { firstName: first, lastName: last } })
      .then(function (res) {
        applyServerState(res.state);
        role = "player";
        currentPlayerId = res.playerId;
        lsSet("to_player_id", res.playerId);
        ui.saving = false;
        ui.gateError = "";
        render();
      })
      .catch(function (err) {
        ui.saving = false;
        ui.gateError = "Anmeldung fehlgeschlagen: " + err.message;
        render();
      });
  };
  window.switchPlayer = function () {
    role = null;
    currentPlayerId = null;
    lsDel("to_player_id");
    ui.gateMode = "picker";
    render();
  };
  window.logoutAdmin = function () {
    role = null;
    adminCode = "";
    lsDel("to_admin_code");
    ui.gateMode = "picker";
    render();
  };

  // ---------- entry saving ----------
  var fieldTimers = {};
  var ENTRY_AUTOSAVE_DELAY_MS = 1200;

  function saveEntryNow(gameId, playerId, value) {
    ui.saving = true;
    var status = document.getElementById("player-save-status");
    if (status) status.textContent = "Wird gespeichert …";
    return api("/api/entry", { method: "POST", body: { gameId: gameId, playerId: playerId, value: value === "" ? null : Number(value) } })
      .then(function (res) {
        applyServerState(res.state);
        ui.saving = false;
        var el = document.getElementById("player-save-status");
        if (el) el.textContent = "Änderungen werden automatisch gespeichert.";
      })

  // ---------- setup actions (admin only) ----------
  // Everything in Setup autosaves - there is no "Speichern" button anywhere.
  // Discrete actions (add/remove player or game, toggle direction) persist
  // immediately; text fields (event info, names, units, admin code) debounce
  // briefly after typing stops so we're not firing a request per keystroke.
  var setupSaveTimer = null;
  var setupSaveInFlight = false;
  var setupSaveQueued = false;
  var SETUP_AUTOSAVE_DELAY_MS = 1200;

  function setSetupStatus(text) {
    var el = document.getElementById("setup-save-status");
    if (el) el.textContent = text;
  }

  function persistSetupNow() {
    if (setupSaveTimer) { clearTimeout(setupSaveTimer); setupSaveTimer = null; }
    // Setup saves fully replace the players/games lists server-side, so two
    // overlapping requests must never both be in flight: a slow earlier
    // request's response could otherwise land after a newer edit and stomp
    // on it. If a save is already running, just flag that another is needed
    // and re-run once the current one finishes, using whatever is in `state`
    // at that point (i.e. every edit made in the meantime, untouched).
    if (setupSaveInFlight) { setupSaveQueued = true; setSetupStatus("Ungespeicherte Änderung …"); return; }
    setupSaveInFlight = true;
    ui.saving = true;
    setSetupStatus("Wird gespeichert …");
    var payload = {
      action: "save-setup",
      code: adminCode,
      eventTitle: state.eventTitle,
      eventSub: state.eventSub,
      eventDate: state.eventDate,
      players: state.players.map(function (p) { return { id: p.id, name: p.name }; }),
      games: state.games.map(function (g) { return { id: g.id, name: g.name, unit: g.unit, direction: g.direction }; }),
    };
    if (ui.newAdminCode && ui.newAdminCode.trim()) payload.adminCode = ui.newAdminCode.trim();
    return api("/api/admin", { method: "POST", body: payload })
      .then(function (res) {
        setupSaveInFlight = false;
        ui.saving = false;
        if (setupSaveQueued) {
          // Something changed while this request was in flight: don't apply
          // this (now-stale) response over it, just re-save the latest state.
          setupSaveQueued = false;
          persistSetupNow();
          return;
        }
        state.eventTitle = res.state.eventTitle;
        state.eventSub = res.state.eventSub;
        state.eventDate = res.state.eventDate;
        state.players = res.state.players;
        state.games = res.state.games;
        if (payload.adminCode) { adminCode = payload.adminCode; lsSet("to_admin_code", adminCode); ui.newAdminCode = ""; }
        setSetupStatus("Änderungen werden automatisch gespeichert.");
        withFocusPreserved(render);
      })
      .catch(function (err) {
        setupSaveInFlight = false;
        ui.saving = false;
        if (err.code === "wrong_code") {
          alert("Admin-Code stimmt nicht (mehr) - bitte neu anmelden.");
          window.logoutAdmin();
        } else if (setupSaveQueued) {
          setupSaveQueued = false;
          persistSetupNow();
        } else {
          setSetupStatus("Speichern fehlgeschlagen: " + err.message);
        }
      });
  }

  function scheduleSetupSave() {
    setSetupStatus("Ungespeicherte Änderung …");
    if (setupSaveTimer) clearTimeout(setupSaveTimer);
    setupSaveTimer = setTimeout(function () {
      setupSaveTimer = null;
      persistSetupNow();
    }, SETUP_AUTOSAVE_DELAY_MS);
  }

  window.onEventField = function (field, val) { state[field] = val; scheduleSetupSave(); };
  window.addPlayer = function () {
    state.players.push({ id: uid("p"), name: "Spieler " + (state.players.length + 1) });

  window.onGameField = function (id, field, val) {

  window.setDirection = function (id, dir) {

      '<div class="field-grid" style="margin-top:0.7rem;"><div><span class="field-label">Mehrere Namen auf einmal hinzufügen (ein Name pro Zeile)</span>' +
      '<textarea id="bulk-add-textarea" rows="4" placeholder="Anna Muster\nMax Mustermann…" oninput="onBulkAddText(this.value)">' + esc(ui.bulkAddText) + '</textarea></div></div>' +
      '<button class="btn add-row" onclick="addPlayersBulk()">Namen hinzufügen</button>' +
      (state.players.length ? '<div style="margin-top:0.9rem;">' + playerRows + "</div>" : '<p class="muted" style="margin-top:0.7rem;">Noch keine Spieler.</p>') +
      '<button class="btn add-row" onclick="addPlayer()">+ Einzelnen Spieler hinzufügen</button>' +
      "</div>" +
      '<div class="card"><h2>Spiele</h2>' + gameRows +
      '<button class="btn add-row" onclick="addGame()">+ Spiel hinzufügen</button>' +
      "</div>" +
      '<p class="muted save-status" id="setup-save-status">Änderungen werden automatisch gespeichert.</p>';
  }

  // ---------- boot ----------
  loadState()
    .then(function () {
      ui.loaded = true;
      render();
      startPolling();
    })
    .catch(function (err) {
      document.getElementById("app-root").innerHTML =
        '<main><div class="card"><h2>Laden fehlgeschlagen</h2><p class="muted">' + esc(err.message) + '</p>' +
        '<button class="btn btn-primary add-row" onclick="location.reload()">Erneut versuchen</button></div></main>';
    });
})();
</script>
</body>
</html>
