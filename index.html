<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Tennis-Olympiade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f7ef;
    --surface: #ffffff;
    --surface-2: #eaf0e1;
    --text: #1b2417;
    --text-muted: #5c6b54;
    --border: #d9e1cf;
    --accent: #6ba50f;
    --accent-ink: #22320a;
    --accent-soft: #e3f0d2;
    --clay: #b8552e;
    --clay-soft: #f3ded3;
    --gold: #ad8a1f;
    --silver: #7c8790;
    --bronze: #a05a26;
    --shadow: rgba(27, 36, 23, 0.10);
    --danger: #b8552e;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10150c;
      --surface: #171f13;
      --surface-2: #202b19;
      --text: #eaf1e1;
      --text-muted: #9db28d;
      --border: #2a3722;
      --accent: #a8e13c;
      --accent-ink: #16210a;
      --accent-soft: #263a15;
      --clay: #e0794c;
      --clay-soft: #3a2418;
      --gold: #e0c04a;
      --silver: #b7c2ca;
      --bronze: #d98a4a;
      --shadow: rgba(0, 0, 0, 0.45);
      --danger: #e0794c;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10150c;
    --surface: #171f13;
    --surface-2: #202b19;
    --text: #eaf1e1;
    --text-muted: #9db28d;
    --border: #2a3722;
    --accent: #a8e13c;
    --accent-ink: #16210a;
    --accent-soft: #263a15;
    --clay: #e0794c;
    --clay-soft: #3a2418;
    --gold: #e0c04a;
    --silver: #b7c2ca;
    --bronze: #d98a4a;
    --shadow: rgba(0, 0, 0, 0.45);
    --danger: #e0794c;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Manrope", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
    padding-bottom: 3rem;
  }
  h1, h2, h3 { font-family: "Anton", "Manrope", sans-serif; font-weight: 400; letter-spacing: 0.01em; text-wrap: balance; margin: 0; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  a { color: var(--accent-ink); }
  :root[data-theme="dark"] a, :root:not([data-theme="light"]) a { color: var(--accent); }
  button { font-family: inherit; }
  input[type="text"], input[type="number"], input[type="search"], textarea {
    font-family: inherit;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 0.6rem;
    padding: 0.6rem 0.7rem;
    color: var(--text);
    font-size: 1rem;
    width: 100%;
  }
  textarea { resize: vertical; font-size: 0.92rem; line-height: 1.4; }
  input:focus-visible, button:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  header.top {
    background: var(--accent-ink);
    color: var(--accent-soft);
    padding: 1.4rem 1.1rem 1.1rem;
    position: relative;
    overflow: hidden;
  }
  header.top::after {
    content: "";
    position: absolute;
    right: -40px; top: -40px;
    width: 160px; height: 160px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, var(--accent) 0%, transparent 70%);
    opacity: 0.35;
  }
  .top-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.9rem; position: relative; z-index: 1; }
  .club-logo { flex: none; height: 56px; width: auto; margin-top: 0.15rem; }
  header.top h1 { font-size: 1.9rem; color: #fff; }
  header.top .sub { font-size: 0.92rem; color: rgba(255,255,255,0.78); margin-top: 0.25rem; }
  header.top .event-meta { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.6rem; position: relative; z-index: 1; }
  .pill {
    display: inline-flex; align-items: center; gap: 0.3rem;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.18);
    color: rgba(255,255,255,0.92);
    padding: 0.25rem 0.65rem;
    border-radius: 999px;
    font-size: 0.78rem;
  }

  nav.tabbar {
    position: sticky; top: 0; z-index: 10;
    display: flex;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 2px 10px var(--shadow);
  }
  nav.tabbar button {
    flex: 1;
    padding: 0.85rem 0.4rem;
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-weight: 600;
    font-size: 0.88rem;
    border-bottom: 3px solid transparent;
    cursor: pointer;
  }
  nav.tabbar button.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }

  main { max-width: 720px; margin: 0 auto; padding: 1.1rem; }
  .view { display: none; }
  .view.active { display: block; }

  .banner {
    background: var(--clay-soft);
    color: var(--clay);
    border: 1px solid var(--clay);
    border-radius: 0.7rem;
    padding: 0.7rem 0.9rem;
    font-size: 0.88rem;
    margin-bottom: 1rem;
    display: none;
  }
  .banner.show { display: block; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 0.9rem;
    padding: 1rem;
    margin-bottom: 0.9rem;
    box-shadow: 0 1px 3px var(--shadow);
  }
  .card h2 { font-size: 1.05rem; margin-bottom: 0.7rem; }
  .card h3 { font-size: 0.98rem; }
  .muted { color: var(--text-muted); font-size: 0.85rem; }
  .center { text-align: center; }

  .lb-row {
    display: flex; align-items: center; gap: 0.8rem;
    padding: 0.7rem 0.2rem;
    border-bottom: 1px solid var(--border);
  }
  .lb-row:last-child { border-bottom: none; }
  .rank-badge {
    flex: none;
    width: 2.3rem; height: 2.3rem;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: "Anton", sans-serif;
    font-size: 1.05rem;
    background: var(--surface-2);
    color: var(--text-muted);
    border: 2px solid var(--border);
  }
  .rank-badge.r1 { background: var(--gold); color: var(--accent-ink); border-color: var(--gold); }
  .rank-badge.r2 { background: var(--silver); color: var(--accent-ink); border-color: var(--silver); }
  .rank-badge.r3 { background: var(--bronze); color: #fff; border-color: var(--bronze); }
  .lb-name { flex: 1; font-weight: 700; font-size: 1.02rem; }
  .lb-total { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
  .lb-total .unit { font-size: 0.7rem; color: var(--text-muted); font-weight: 500; margin-left: 0.2rem; }

  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 0.7rem; }
  table.matrix { border-collapse: collapse; width: 100%; font-size: 0.82rem; }
  table.matrix th, table.matrix td {
    padding: 0.5rem 0.6rem;
    text-align: center;
    white-space: nowrap;
    border-bottom: 1px solid var(--border);
  }
  table.matrix th { background: var(--surface-2); font-weight: 700; text-align: left; }
  table.matrix td:first-child, table.matrix th:first-child { text-align: left; font-weight: 600; position: sticky; left: 0; background: var(--surface); }
  table.matrix th:first-child { background: var(--surface-2); }
  table.matrix td.total-col, table.matrix th.total-col { font-weight: 800; font-family: "JetBrains Mono", monospace; }

  .explain-title {
    font-weight: 700; font-size: 0.9rem; color: var(--accent-ink);
  }
  :root[data-theme="dark"] .explain-title,
  :root:not([data-theme="light"]) .explain-title { color: var(--accent); }
  .explain p { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; margin: 0.6rem 0 0; }

  .player-row, .game-setup-row {
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0.5rem 0; border-bottom: 1px solid var(--border);
  }
  .player-row:last-of-type, .game-setup-row:last-of-type { border-bottom: none; }

  .icon-btn {
    flex: none; width: 2.2rem; height: 2.2rem;
    border-radius: 0.5rem; border: 1px solid var(--border);
    background: var(--surface); color: var(--danger);
    cursor: pointer; font-size: 1rem; line-height: 1;
  }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
    border-radius: 0.65rem;
    padding: 0.65rem 1rem;
    font-weight: 700;
    font-size: 0.92rem;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
  }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn-block { width: 100%; }
  .btn:disabled { opacity: 0.6; cursor: default; }
  .btn-pick { justify-content: flex-start; text-align: left; }

  .game-setup-card { border: 1px solid var(--border); border-radius: 0.75rem; padding: 0.8rem; margin-bottom: 0.7rem; background: var(--surface-2); }
  .field-grid { display: grid; grid-template-columns: 1fr; gap: 0.5rem; margin-top: 0.5rem; }
  .field-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); margin-bottom: 0.2rem; display: block; }
  .direction-toggle { display: flex; gap: 0.4rem; }
  .direction-toggle button {
    flex: 1; padding: 0.5rem; border-radius: 0.5rem; border: 1px solid var(--border);
    background: var(--surface); color: var(--text-muted); font-size: 0.78rem; font-weight: 700; cursor: pointer;
  }
  .direction-toggle button.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
  :root[data-theme="dark"] .direction-toggle button.active,
  :root:not([data-theme="light"]) .direction-toggle button.active { color: var(--accent); }
  .row-top { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }

  .game-item { border: 1px solid var(--border); border-radius: 0.8rem; margin-bottom: 0.7rem; overflow: hidden; background: var(--surface); }
  .game-item-head {
    display: flex; align-items: center; justify-content: space-between; gap: 0.6rem;
    padding: 0.85rem 1rem; cursor: pointer; background: var(--surface);
  }
  .game-item-head h3 { font-size: 0.98rem; }
  .game-item-head .status { font-size: 0.76rem; color: var(--text-muted); margin-top: 0.15rem; }
  .status.complete { color: var(--accent-ink); font-weight: 700; }
  :root[data-theme="dark"] .status.complete,
  :root:not([data-theme="light"]) .status.complete { color: var(--accent); }
  .chev { transition: transform 0.15s ease; color: var(--text-muted); flex: none; }
  .game-item.open .chev { transform: rotate(90deg); }
  .game-item-body { display: none; padding: 0 1rem 1rem; border-top: 1px solid var(--border); }
  .game-item.open .game-item-body { display: block; }

  .entry-row { display: flex; align-items: center; gap: 0.6rem; padding: 0.55rem 0; border-bottom: 1px dashed var(--border); }
  .entry-row:last-of-type { border-bottom: none; }
  .entry-row .name { flex: 1; font-weight: 600; font-size: 0.92rem; }
  .entry-row input[type="number"] { width: 6.5rem; text-align: right; flex: none; }
  .entry-row .unit { width: 3.2rem; font-size: 0.76rem; color: var(--text-muted); }

  .whoami { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; }
  .whoami .stat { text-align: right; }

  footer.note { text-align: center; color: var(--text-muted); font-size: 0.78rem; padding: 1.4rem 1rem 0.4rem; }
  .add-row { margin-top: 0.6rem; }
  .loading { padding: 2.5rem 1rem; text-align: center; color: var(--text-muted); }
  .draw-card { display: flex; gap: 0.8rem; flex-wrap: wrap; }
  .draw-cell { flex: 1 1 8rem; min-width: 0; background: var(--surface-2); border: 1px solid var(--border); border-radius: 0.7rem; padding: 0.7rem 0.8rem; }
  .draw-cell .k { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
  .draw-cell .v { font-family: "Anton", sans-serif; font-size: 1.5rem; margin-top: 0.15rem; }
  .draw-cell .v small { font-family: "Manrope", sans-serif; font-size: 0.8rem; color: var(--text-muted); margin-left: 0.3rem; }
  .game-block-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin: 1.2rem 0 0.5rem; font-weight: 700; }
  .pgame { border: 1px solid var(--border); border-radius: 0.8rem; padding: 0.85rem 0.9rem; margin-bottom: 0.6rem; background: var(--surface); }
  .pgame-head { display: flex; justify-content: space-between; align-items: baseline; gap: 0.6rem; }
  .pgame-head h3 { font-size: 1.02rem; }
  .pts-chip { flex: none; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 0.85rem; padding: 0.15rem 0.55rem; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink); font-variant-numeric: tabular-nums; }
  :root[data-theme="dark"] .pts-chip, :root:not([data-theme="light"]) .pts-chip { color: var(--accent); }
  .pts-chip.empty { background: var(--surface-2); color: var(--text-muted); font-weight: 500; }
  .hint { font-size: 0.84rem; color: var(--text-muted); margin: 0.35rem 0 0.55rem; line-height: 1.45; }
  .input-line { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
  .input-line input[type="number"] { width: 7rem; flex: none; text-align: right; font-family: "JetBrains Mono", monospace; }
  .input-line .unit { font-size: 0.82rem; color: var(--text-muted); }
  .chip-btn { border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); border-radius: 999px; padding: 0.4rem 0.75rem; font-size: 0.8rem; font-weight: 700; cursor: pointer; }
  .chip-btn.on { background: var(--clay-soft); color: var(--clay); border-color: var(--clay); }
  .err { color: var(--danger); font-size: 0.8rem; margin-top: 0.35rem; }
  .lock-note { font-size: 0.8rem; color: var(--clay); font-weight: 700; margin-top: 0.4rem; }
  details.rules { margin-top: 0.55rem; }
  details.rules summary { cursor: pointer; font-size: 0.82rem; font-weight: 700; color: var(--text-muted); list-style: none; }
  details.rules summary::-webkit-details-marker { display: none; }
  details.rules summary::before { content: "▸ "; }
  details.rules[open] summary::before { content: "▾ "; }
  details.rules p, details.rules li { font-size: 0.85rem; line-height: 1.5; color: var(--text); }
  details.rules p { margin: 0.45rem 0 0; }
  details.rules ul { margin: 0.4rem 0 0; padding-left: 1.1rem; }
  .plan { margin-top: 0.5rem; font-family: "JetBrains Mono", monospace; font-size: 0.78rem; background: var(--surface-2); border-radius: 0.5rem; padding: 0.5rem 0.65rem; overflow-x: auto; white-space: pre; color: var(--text); }
  .court-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: 0.6rem; margin-top: 0.7rem; }
  .court { background: var(--surface-2); border: 1px solid var(--border); border-radius: 0.7rem; padding: 0.7rem; min-width: 0; }
  .court h3 { font-size: 0.95rem; margin-bottom: 0.4rem; }
  .court ol { margin: 0; padding-left: 1.4rem; font-size: 0.86rem; line-height: 1.55; }
  .btn-row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.7rem; }
  .btn-row .btn { flex: 1 1 10rem; }
  .btn-danger { color: var(--danger); border-color: var(--danger); }
  .confirm { background: var(--clay-soft); border: 1px solid var(--clay); border-radius: 0.6rem; padding: 0.7rem; margin-top: 0.7rem; font-size: 0.86rem; color: var(--text); }
  .admin-entry { display: flex; align-items: center; gap: 0.5rem; padding: 0.45rem 0; border-bottom: 1px dashed var(--border); flex-wrap: wrap; }
  .admin-entry:last-of-type { border-bottom: none; }
  .admin-entry .name { flex: 1 1 8rem; min-width: 0; font-weight: 600; font-size: 0.92rem; }
  .admin-entry input[type="number"] { width: 6rem; text-align: right; font-family: "JetBrains Mono", monospace; }
  .admin-entry .pts-chip { min-width: 3.4rem; text-align: center; }
  .toggle-line { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; margin: 0.6rem 0; }
  .tag { display: inline-block; font-size: 0.7rem; font-weight: 700; padding: 0.1rem 0.45rem; border-radius: 999px; background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border); margin-left: 0.35rem; vertical-align: middle; }
  .tag.locked { background: var(--clay-soft); color: var(--clay); border-color: var(--clay); }
  .setup-game { border: 1px solid var(--border); border-radius: 0.7rem; padding: 0.7rem; margin-bottom: 0.6rem; background: var(--surface-2); }
  .setup-game .field-grid { margin-top: 0.4rem; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <div>
      <h1 id="event-title-display">Tennis-Olympiade</h1>
      <div class="sub" id="event-sub-display">Live-Scoreboard</div>
      <div class="event-meta">
        <span class="pill" id="event-date-pill">📅 Datum offen</span>
        <span class="pill" id="event-players-pill">Spieler</span>
        <span class="pill" id="event-games-pill">Spiele</span>
      </div>
    </div>
    <img class="club-logo" src="/logo.png" alt="RTC Tennisclub Logo">
  </div>
</header>
<div id="app-root"><main><p class="muted center" style="padding-top:2rem;">Lade …</p></main></div>
<script>
(function () {
  "use strict";

  var POLL_MS = 7000;
  var NOTE_SEVEN = "Bei 7 Spieler:innen übernimmt jemand, der gerade frei ist, die fehlende Nr. 8. Gewertet werden nur die eigenen Matches.";

  // ---------- helpers ----------
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function ssGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
  function ssSet(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function fmt(n) { return (Math.round(n * 10) / 10).toFixed(1).replace(".", ","); }
  function normName(s) { return String(s || "").replace(/\s+/g, " ").trim().toLowerCase(); }

  async function api(path, body) {
    var res = await fetch(path, {
      method: body ? "POST" : "GET",
      headers: body ? { "Content-Type": "application/json" } : undefined,
      body: body ? JSON.stringify(body) : undefined,
      cache: "no-store"
    });
    var data = null;
    try { data = await res.json(); } catch (e) {}
    if (!res.ok) {
      var err = new Error((data && data.message) || ("HTTP " + res.status));
      err.code = data && data.error; err.status = res.status;
      throw err;
    }
    return data;
  }

  // ---------- state ----------
  var state = { eventTitle: "Tennis-Olympiade", eventSub: "", eventDate: "", players: [], games: [] };
  var loaded = false, loadError = "";
  var adminCode = lsGet("to_admin_code") || "";
  var role = adminCode ? "admin" : null;
  var currentPlayerId = role ? null : lsGet("to_player_id");
  if (currentPlayerId) role = "player";

  var ui = {
    tab: ssGet("to_tab") || "rangliste",
    openGame: ssGet("to_game") || "",
    gateMode: "register", gateError: "", gateFirst: "", gateLast: "", gateFilter: "", codeInput: "",
    busy: false, errors: {}, drafts: {}, pending: 0, confirm: "", lbFilter: "", saveMsg: ""
  };

  function playerById(id) { return state.players.find(function (p) { return p.id === id; }); }
  function gameById(id) { return state.games.find(function (g) { return g.id === id; }); }
  function resultOf(g, pid) { return g.entries ? g.entries[pid] : undefined; }
  function hasResult(v) { return v === "foul" || typeof v === "number"; }

  // ---------- scoring: rank over all entries, 1st = 10, last = 1, ties share the average rank ----------
  function gamePoints(game) {
    var entries = [], out = {};
    state.players.forEach(function (p) {
      var v = resultOf(game, p.id);
      if (v === "foul") out[p.id] = 0;
      else if (typeof v === "number" && isFinite(v)) entries.push({ id: p.id, v: v });
    });
    var n = entries.length;
    entries.sort(function (a, b) { return game.direction === "low" ? a.v - b.v : b.v - a.v; });
    var i = 0;
    while (i < n) {
      var j = i;
      while (j + 1 < n && entries[j + 1].v === entries[i].v) j++;
      var avgRank = (i + j) / 2 + 1;
      var pts = n === 1 ? 10 : 10 - 9 * (avgRank - 1) / (n - 1);
      for (var k = i; k <= j; k++) out[entries[k].id] = pts;
      i = j + 1;
    }
    return out;
  }
  function allPoints() {
    var per = {}, totals = {};
    state.games.forEach(function (g) { per[g.id] = gamePoints(g); });
    state.players.forEach(function (p) {
      var t = 0;
      state.games.forEach(function (g) { if (per[g.id][p.id] !== undefined) t += per[g.id][p.id]; });
      totals[p.id] = t;
    });
    return { per: per, totals: totals };
  }

  // ---------- loading & polling ----------
  function applyState(s) {
    if (!s) return;
    state = s;
    loaded = true; loadError = "";
    if (role === "player" && !playerById(currentPlayerId)) { role = null; currentPlayerId = null; lsDel("to_player_id"); }
  }
  function load() {
    return api("/api/state").then(function (s) { applyState(s); render(); }).catch(function (e) {
      if (!loaded) { loadError = e.message; render(); }
    });
  }
  function userIsTyping() {
    var el = document.activeElement;
    return !!(el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA"));
  }
  setInterval(function () {
    if (ui.pending > 0 || ui.busy || userIsTyping()) return;
    if (role === "admin" && ui.tab === "setup") return;
    load();
  }, POLL_MS);

  // ---------- saving results (debounced per field) ----------
  var timers = {};
  function queueSave(pid, gid, value) {
    var key = pid + ":" + gid;
    if (timers[key]) clearTimeout(timers[key]);
    timers[key] = setTimeout(function () {
      delete timers[key];
      ui.pending++;
      api("/api/entry", { gameId: gid, playerId: pid, value: value, code: role === "admin" ? adminCode : undefined })
        .then(function (r) {
          ui.pending--; ui.saveMsg = "";
          if (ui.pending === 0 && !Object.keys(timers).length) { ui.drafts = {}; applyState(r.state); }
          render();
        })
        .catch(function (e) {
          ui.pending--;
          ui.errors[key] = e.message || "Speichern hat nicht geklappt.";
          render();
        });
    }, 700);
  }

  // ---------- render ----------
  function render() {
    var active = document.activeElement, activeId = active && active.id, s = null, e2 = null;
    if (active && "selectionStart" in active) { try { s = active.selectionStart; e2 = active.selectionEnd; } catch (x) {} }
    renderInner();
    if (activeId) {
      var el = document.getElementById(activeId);
      if (el) { el.focus(); if (s != null) { try { el.setSelectionRange(s, e2); } catch (x) {} } }
    }
  }

  function renderInner() {
    document.title = state.eventTitle || "Tennis-Olympiade";
    document.getElementById("event-title-display").textContent = state.eventTitle || "Tennis-Olympiade";
    document.getElementById("event-sub-display").textContent = state.eventSub || "";
    document.getElementById("event-date-pill").textContent = "📅 " + (state.eventDate || "Datum offen");
    document.getElementById("event-players-pill").textContent = state.players.length + " Spieler:innen";
    document.getElementById("event-games-pill").textContent = state.games.length + " Spiele";
    var root = document.getElementById("app-root");
    if (!loaded) {
      root.innerHTML = '<main><div class="loading">' + (loadError ? 'Die Ergebnisse konnten nicht geladen werden. Bitte Seite neu laden.' : 'Lade …') + '</div></main>';
      return;
    }
    if (role === "admin") renderAdmin(root);
    else if (role === "player" && playerById(currentPlayerId)) renderPlayer(root);
    else renderGate(root);
  }

  // ---------- gate ----------
  function renderGate(root) {
    var html;
    if (ui.gateMode === "admin") {
      html = '<div class="card"><h2>Admin-Zugang</h2><p class="muted">Code eingeben, um Rangliste, Ergebnisse und Setup zu sehen.</p>' +
        '<form onsubmit="event.preventDefault();TO.submitCode();" class="field-grid">' +
        '<input type="text" id="admin-code" autocomplete="off" placeholder="Admin-Code" value="' + esc(ui.codeInput) + '" oninput="TO.set(\'codeInput\', this.value)">' +
        (ui.gateError ? '<p class="err">' + esc(ui.gateError) + '</p>' : '') +
        '<button class="btn btn-primary btn-block" type="submit" ' + (ui.busy ? 'disabled' : '') + '>' + (ui.busy ? 'Prüfe …' : 'Entsperren') + '</button></form>' +
        '<button class="btn btn-block add-row" onclick="TO.gate(\'register\')">Zurück</button></div>';
    } else {
      var list = state.players.slice().sort(function (a, b) { return a.name.localeCompare(b.name, "de"); });
      var f = normName(ui.gateFilter);
      var vis = list.filter(function (p) { return !f || normName(p.name).indexOf(f) !== -1; });
      html = '<div class="card"><h2>Anmelden</h2><p class="muted">Einmal mit Vor- und Nachname anmelden. Danach trägst du nach jedem Spiel dein Ergebnis selbst ein.</p>' +
        '<form onsubmit="event.preventDefault();TO.register();" class="field-grid">' +
        '<div><label class="field-label" for="gate-first">Vorname</label><input type="text" id="gate-first" autocomplete="given-name" value="' + esc(ui.gateFirst) + '" oninput="TO.set(\'gateFirst\', this.value)"></div>' +
        '<div><label class="field-label" for="gate-last">Nachname</label><input type="text" id="gate-last" autocomplete="family-name" value="' + esc(ui.gateLast) + '" oninput="TO.set(\'gateLast\', this.value)"></div>' +
        (ui.gateError ? '<p class="err">' + esc(ui.gateError) + '</p>' : '') +
        '<button class="btn btn-primary btn-block" type="submit" ' + (ui.busy ? 'disabled' : '') + '>' + (ui.busy ? 'Wird angemeldet …' : 'Anmelden') + '</button></form></div>';
      if (list.length) {
        html += '<div class="card"><h2>Schon angemeldet?</h2><p class="muted">Tipp deinen Namen an, zum Beispiel auf einem neuen Handy.</p>' +
          (list.length > 8 ? '<input type="search" id="gate-filter" placeholder="Name suchen …" value="' + esc(ui.gateFilter) + '" oninput="TO.set(\'gateFilter\', this.value, true)" style="margin-bottom:0.4rem;">' : '') +
          (vis.length ? vis.map(function (p) { return '<button class="btn btn-block btn-pick add-row" onclick="TO.pick(\'' + esc(p.id) + '\')">' + esc(p.name) + '</button>'; }).join('') : '<p class="muted">Keine Treffer.</p>') +
          '</div>';
      }
      html += '<p class="muted center"><a href="#" onclick="TO.gate(\'admin\');return false;">Ich bin Admin</a></p>';
    }
    root.innerHTML = '<main>' + html + '</main>';
  }

  // ---------- result input (shared by player and admin) ----------
  function resultInput(g, pid, prefix, compact) {
    var key = pid + ":" + g.id;
    var val = resultOf(g, pid);
    var locked = g.locked && role !== "admin";
    var shown = ui.drafts[key] !== undefined ? ui.drafts[key] : (typeof val === "number" ? String(val).replace(".", ",") : "");
    var isFoul = ui.drafts[key] === undefined && val === "foul";
    var dis = locked ? "disabled " : "";
    var h = '<div class="input-line">' +
      '<input type="text" inputmode="decimal" id="' + prefix + '-' + esc(pid) + '-' + g.id + '" placeholder="–" aria-label="' + esc(g.name) + ' Ergebnis" ' + dis +
      'value="' + (isFoul ? '' : esc(shown)) + '" oninput="TO.entry(\'' + esc(pid) + '\', \'' + g.id + '\', this.value)">' +
      '<span class="unit">' + esc(g.unit) + '</span>';
    if (g.foul) h += '<button class="chip-btn' + (isFoul ? ' on' : '') + '" ' + dis + 'onclick="TO.foul(\'' + esc(pid) + '\', \'' + g.id + '\')">Nur Fouls</button>';
    h += '</div>';
    if (ui.errors[key]) h += '<p class="err">' + esc(ui.errors[key]) + '</p>';
    if (locked && !compact) h += '<p class="lock-note">Dieses Spiel ist abgeschlossen. Änderungen nur noch über den Admin.</p>';
    return h;
  }
  function rulesBlock(g) {
    return '<details class="rules"><summary>Regeln</summary><p>' + esc(g.rules) + '</p>' +
      (g.plan ? '<div class="plan">Spielplan (nummeriert euch auf dem Platz von 1 bis 8)\n' + esc(g.plan) + '</div><p class="muted">' + esc(NOTE_SEVEN) + '</p>' : '') +
      '</details>';
  }

  // ---------- player ----------
  function renderPlayer(root) {
    var p = playerById(currentPlayerId);
    var done = state.games.filter(function (g) { return hasResult(resultOf(g, p.id)); }).length;
    var html = '<div class="card"><div class="whoami"><div><div class="muted">Angemeldet als</div><h2>' + esc(p.name) + '</h2></div>' +
      '<div class="stat"><div class="muted">Eingetragen</div><div class="lb-total">' + done + '<span class="unit">von ' + state.games.length + '</span></div></div></div></div>' +
      '<div class="game-block-label">Deine Spiele</div>';
    state.games.forEach(function (g) {
      var has = hasResult(resultOf(g, p.id));
      html += '<div class="pgame"><div class="pgame-head"><h3>' + esc(g.name) + (g.locked ? '<span class="tag locked">abgeschlossen</span>' : '') + '</h3>' +
        '<span class="pts-chip' + (has ? '' : ' empty') + '">' + (has ? 'eingetragen ✓' : 'offen') + '</span></div>' +
        '<p class="hint">' + esc(g.hint) + '</p>' + resultInput(g, p.id, "me") + rulesBlock(g) + '</div>';
    });
    html += '<details class="explain card"><summary>Wie wird gewertet?</summary><p>Pro Spiel bilden alle Ergebnisse eine gemeinsame Rangliste über alle Teilnehmer:innen. Platz 1 bekommt 10 Punkte, der letzte Platz 1 Punkt, dazwischen wird gleichmäßig verteilt. Punkte und Platzierungen gibt es erst bei der Siegerehrung.</p></details>' +
      '<p class="muted center">' + (ui.pending || Object.keys(timers).length ? 'Wird gespeichert …' : 'Eingaben werden automatisch gespeichert.') + '</p>' +
      '<p class="muted center"><a href="#" onclick="TO.logout();return false;">Nicht ' + esc(p.name) + '? Abmelden</a></p>';
    root.innerHTML = '<main>' + html + '</main>';
  }

  // ---------- admin ----------
  function renderAdmin(root) {
    var tabs = [["rangliste", "Rangliste"], ["eingabe", "Ergebnisse"], ["setup", "Setup"]];
    if (!tabs.some(function (t) { return t[0] === ui.tab; })) ui.tab = "rangliste";
    var html = '<nav class="tabbar">' + tabs.map(function (t) {
      return '<button class="' + (ui.tab === t[0] ? 'active' : '') + '" onclick="TO.tab(\'' + t[0] + '\')">' + t[1] + '</button>';
    }).join('') + '</nav><main>' + (ui.saveMsg ? '<div class="banner show">' + esc(ui.saveMsg) + '</div>' : '');
    if (ui.tab === "eingabe") html += adminEntry();
    else if (ui.tab === "setup") html += adminSetup();
    else html += adminRanking();
    html += '<p class="muted center" style="margin-top:1rem;"><a href="#" onclick="TO.logout();return false;">Admin abmelden</a></p></main>';
    root.innerHTML = html;
  }

  function adminRanking() {
    var pts = allPoints();
    var list = state.players.map(function (p) { return { id: p.id, name: p.name, total: pts.totals[p.id] || 0 }; })
      .sort(function (a, b) { return b.total - a.total || a.name.localeCompare(b.name, "de"); });
    var rank = 0, prev = null;
    list.forEach(function (p, i) { if (p.total !== prev) { rank = i + 1; prev = p.total; } p.rank = rank; });
    if (!list.length) return '<div class="card"><h2>Gesamtwertung</h2><p class="muted">Noch niemand angemeldet.</p></div>';
    var f = normName(ui.lbFilter);
    var vis = list.filter(function (p) { return !f || normName(p.name).indexOf(f) !== -1; });
    var rows = vis.map(function (p) {
      var rc = p.rank === 1 ? "r1" : p.rank === 2 ? "r2" : p.rank === 3 ? "r3" : "";
      return '<div class="lb-row"><div class="rank-badge ' + rc + '">' + p.rank + '</div><div class="lb-name">' + esc(p.name) + '</div><div class="lb-total">' + fmt(p.total) + '<span class="unit">Pkt</span></div></div>';
    }).join('');
    var head = state.games.map(function (g) { return '<th>' + esc(g.name) + '</th>'; }).join('');
    var body = vis.map(function (p) {
      return '<tr><td>' + esc(p.name) + '</td>' + state.games.map(function (g) {
        var v = pts.per[g.id][p.id]; return '<td class="mono">' + (v === undefined ? '–' : fmt(v)) + '</td>';
      }).join('') + '<td class="total-col">' + fmt(p.total) + '</td></tr>';
    }).join('');
    return '<div class="card"><h2>Gesamtwertung</h2>' +
      (list.length > 8 ? '<input type="search" id="lb-filter" placeholder="Name suchen …" value="' + esc(ui.lbFilter) + '" oninput="TO.set(\'lbFilter\', this.value, true)" style="margin-bottom:0.5rem;">' : '') +
      rows + '</div>' +
      '<div class="card"><h2>Punkte je Spiel</h2><div class="table-wrap"><table class="matrix"><thead><tr><th>Name</th>' + head + '<th class="total-col">Gesamt</th></tr></thead><tbody>' + body + '</tbody></table></div>' +
      '<p class="muted" style="margin-top:0.6rem;">Pro Spiel: Platz 1 über alle = 10 Punkte, letzter Platz = 1 Punkt, gleichmäßig dazwischen. Gleichstand = Durchschnitt der Plätze. „Nur Fouls“ = 0 Punkte. Nur für Admins sichtbar.</p></div>';
  }

  function adminEntry() {
    var list = state.players.slice().sort(function (a, b) { return a.name.localeCompare(b.name, "de"); });
    var pts = allPoints();
    var html = '<div class="card"><h2>Ergebnisse</h2><p class="muted">Spieler:innen tragen selbst ein. Hier siehst du, wer noch fehlt, kannst korrigieren und ein Spiel abschließen. Danach können Spieler:innen es nicht mehr ändern.</p></div>';
    state.games.forEach(function (g) {
      var entered = list.filter(function (p) { return hasResult(resultOf(g, p.id)); }).length;
      var open = ui.openGame === g.id;
      html += '<div class="game-item' + (open ? ' open' : '') + '"><div class="game-item-head" onclick="TO.toggleGame(\'' + g.id + '\')"><div><h3>' + esc(g.name) +
        (g.locked ? '<span class="tag locked">abgeschlossen</span>' : '') + '</h3><div class="status' + (list.length && entered === list.length ? ' complete' : '') + '">' + entered + ' von ' + list.length + ' eingetragen · ' + (g.direction === "low" ? 'weniger' : 'mehr') + ' ' + esc(g.unit) + ' ist besser</div></div><div class="chev">▸</div></div>';
      if (open) {
        html += '<div class="game-item-body"><div class="toggle-line"><span class="muted">' + (g.locked ? 'Abgeschlossen: Spieler:innen können nichts mehr ändern.' : 'Offen: Spieler:innen können eintragen.') + '</span>' +
          '<button class="btn" onclick="TO.lock(\'' + g.id + '\')">' + (g.locked ? 'Wieder öffnen' : 'Abschließen') + '</button></div>';
        var missing = list.filter(function (p) { return !hasResult(resultOf(g, p.id)); });
        if (missing.length && missing.length < list.length) html += '<p class="hint"><strong>Fehlt noch:</strong> ' + missing.map(function (p) { return esc(p.name); }).join(', ') + '</p>';
        html += list.map(function (p) {
          var v = pts.per[g.id][p.id];
          return '<div class="admin-entry"><div class="name">' + esc(p.name) + '</div>' + resultInput(g, p.id, "adm", true) + '<span class="pts-chip' + (v === undefined ? ' empty' : '') + '">' + (v === undefined ? '–' : fmt(v)) + '</span></div>';
        }).join('') + (list.length ? '' : '<p class="muted">Noch niemand angemeldet.</p>') + '</div>';
      }
      html += '</div>';
    });
    return html;
  }

  function adminSetup() {
    var html = '<div class="card"><h2>Event</h2><div class="field-grid">' +
      field("Titel", "cfg-title", state.eventTitle, "eventTitle") + field("Untertitel", "cfg-sub", state.eventSub, "eventSub") +
      field("Datum", "cfg-date", state.eventDate, "eventDate") +
      '<div><label class="field-label" for="cfg-code">Neuer Admin-Code (leer lassen = unverändert)</label><input type="text" id="cfg-code" autocomplete="off" value="" onchange="TO.newCode(this.value)"></div>' +
      '</div><p class="muted" style="margin-top:0.5rem;">Änderungen werden gespeichert, sobald du ein Feld verlässt.</p></div>';
    html += '<div class="card"><h2>Spiele</h2><p class="muted">Regeln und Eingabehinweise erscheinen so bei den Spieler:innen.</p>';
    state.games.forEach(function (g) {
      html += '<div class="setup-game"><strong>' + esc(g.name) + '</strong> <span class="tag">' + (g.direction === "low" ? 'weniger ist besser' : 'mehr ist besser') + '</span><span class="tag">' + g.min + '–' + g.max + ' ' + esc(g.unit) + '</span>' +
        '<div class="field-grid"><div><label class="field-label" for="g-rules-' + g.id + '">Regeln</label><textarea id="g-rules-' + g.id + '" rows="4" onchange="TO.gameText(\'' + g.id + '\', \'rules\', this.value)">' + esc(g.rules) + '</textarea></div>' +
        '<div><label class="field-label" for="g-hint-' + g.id + '">Was wird eingetragen?</label><textarea id="g-hint-' + g.id + '" rows="2" onchange="TO.gameText(\'' + g.id + '\', \'hint\', this.value)">' + esc(g.hint) + '</textarea></div></div></div>';
    });
    html += '</div><div class="card"><h2>Spieler:innen</h2><p class="muted">Alle melden sich selbst an. Hier kannst du Tippfehler korrigieren und Doppelte entfernen.</p>';
    html += state.players.slice().sort(function (a, b) { return a.name.localeCompare(b.name, "de"); }).map(function (p) {
      var ck = "del" + p.id;
      return '<div class="player-row"><input type="text" id="pn-' + esc(p.id) + '" value="' + esc(p.name) + '" onchange="TO.rename(\'' + esc(p.id) + '\', this.value)">' +
        (ui.confirm === ck
          ? '<button class="btn btn-danger" onclick="TO.remove(\'' + esc(p.id) + '\')">Löschen</button><button class="btn" onclick="TO.set(\'confirm\', \'\')">Nein</button>'
          : '<button class="icon-btn" onclick="TO.set(\'confirm\', \'' + esc(ck) + '\')" aria-label="' + esc(p.name) + ' entfernen">✕</button>') + '</div>';
    }).join('') + (state.players.length ? '' : '<p class="muted">Noch niemand angemeldet.</p>') + '</div>';
    return html;
    function field(label, id, val, key) {
      return '<div><label class="field-label" for="' + id + '">' + label + '</label><input type="text" id="' + id + '" value="' + esc(val || "") + '" onchange="TO.eventField(\'' + key + '\', this.value)"></div>';
    }
  }

  // ---------- admin calls ----------
  function adminCall(body) {
    body.code = adminCode;
    ui.busy = true;
    return api("/api/admin", body).then(function (r) {
      ui.busy = false; ui.saveMsg = ""; applyState(r.state); render();
    }).catch(function (e) {
      ui.busy = false;
      if (e.code === "wrong_code") { TO.logout(); ui.gateMode = "admin"; ui.gateError = "Der Admin-Code hat sich geändert. Bitte neu entsperren."; render(); return; }
      ui.saveMsg = e.message || "Speichern hat nicht geklappt."; render();
    });
  }

  // ---------- actions ----------
  var TO = window.TO = {
    set: function (k, v, rerender) { ui[k] = v; if (k === "confirm" || rerender) render(); },
    gate: function (m) { ui.gateMode = m; ui.gateError = ""; render(); },
    submitCode: function () {
      var code = ui.codeInput.trim();
      if (!code) { ui.gateError = "Bitte Code eingeben."; render(); return; }
      ui.busy = true; ui.gateError = ""; render();
      api("/api/admin", { action: "login", code: code }).then(function () {
        adminCode = code; lsSet("to_admin_code", code); lsDel("to_player_id");
        role = "admin"; currentPlayerId = null; ui.busy = false; ui.codeInput = ""; render();
      }).catch(function (e) {
        ui.busy = false; ui.gateError = e.code === "wrong_code" ? "Der Code stimmt nicht." : "Prüfung fehlgeschlagen. Bitte noch einmal versuchen."; render();
      });
    },
    pick: function (id) { role = "player"; currentPlayerId = id; lsSet("to_player_id", id); render(); window.scrollTo(0, 0); },
    register: function () {
      var first = ui.gateFirst.trim(), last = ui.gateLast.trim();
      if (!first || !last) { ui.gateError = "Bitte Vor- und Nachnamen eingeben."; render(); return; }
      ui.busy = true; ui.gateError = ""; render();
      api("/api/register", { firstName: first, lastName: last }).then(function (r) {
        applyState(r.state); ui.busy = false; TO.pick(r.playerId);
      }).catch(function () {
        ui.busy = false; ui.gateError = "Anmeldung hat nicht geklappt. Bitte noch einmal versuchen."; render();
      });
    },
    logout: function () { role = null; currentPlayerId = null; adminCode = ""; lsDel("to_player_id"); lsDel("to_admin_code"); ui.gateMode = "register"; render(); },
    tab: function (t) { ui.tab = t; ui.confirm = ""; ssSet("to_tab", t); render(); window.scrollTo(0, 0); },
    toggleGame: function (id) { ui.openGame = ui.openGame === id ? "" : id; ssSet("to_game", ui.openGame); render(); },
    entry: function (pid, gid, raw) {
      var g = gameById(gid), key = pid + ":" + gid;
      if (!g || (g.locked && role !== "admin")) return;
      ui.drafts[key] = raw;
      var s = String(raw).trim().replace(",", ".");
      if (s === "") { delete ui.errors[key]; queueSave(pid, gid, null); render(); return; }
      var n = Number(s);
      if (!isFinite(n) || n < g.min || n > g.max) {
        ui.errors[key] = "Bitte eine Zahl von " + g.min + " bis " + g.max + " eintragen.";
        if (timers[key]) { clearTimeout(timers[key]); delete timers[key]; }
        render(); return;
      }
      delete ui.errors[key];
      g.entries[pid] = n;
      queueSave(pid, gid, n);
      render();
    },
    foul: function (pid, gid) {
      var g = gameById(gid); if (!g || (g.locked && role !== "admin")) return;
      var key = pid + ":" + gid;
      var next = resultOf(g, pid) === "foul" ? null : "foul";
      delete ui.drafts[key]; delete ui.errors[key];
      if (next) g.entries[pid] = "foul"; else delete g.entries[pid];
      queueSave(pid, gid, next);
      render();
    },
    lock: function (gid) { var g = gameById(gid); if (g) adminCall({ action: "game", gameId: gid, locked: !g.locked }); },
    gameText: function (gid, field, v) { var b = { action: "game", gameId: gid }; b[field] = v; adminCall(b); },
    eventField: function (k, v) { var b = { action: "save-event" }; b[k] = v; adminCall(b); },
    newCode: function (v) {
      v = String(v).trim(); if (!v) return;
      var old = adminCode;
      adminCall({ action: "save-event", adminCode: v }).then(function () {
        if (!ui.saveMsg && role === "admin") { adminCode = v; lsSet("to_admin_code", v); ui.saveMsg = "Admin-Code geändert. Gib den neuen Code an die anderen Admins weiter."; render(); }
        else adminCode = adminCode || old;
      });
    },
    rename: function (pid, v) { var name = String(v).replace(/\s+/g, " ").trim(); if (name) adminCall({ action: "player", playerId: pid, name: name }); },
    remove: function (pid) { ui.confirm = ""; adminCall({ action: "player", playerId: pid, remove: true }); }
  };

  render();
  load();
})();
</script>
</body>
</html>
